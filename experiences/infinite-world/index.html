<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Infinite World</title>
        <link rel="stylesheet" href="./sources/style.css">

        <meta itemprop="name" content="Infinite World">
        <meta itemprop="description" content="Infinite procedurally generated world by Bruno Simon">
        <meta itemprop="image" content="https://infinite-world.vercel.app/social/share-1200x630.png">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Infinite World">
        <meta name="twitter:description" content="Infinite procedurally generated world by Bruno Simon">
        <meta name="twitter:image" content="https://infinite-world.vercel.app/social/share-1200x600.png">

        <meta property="og:site_name" content="Three.js Journey">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://infinite-world.vercel.app/">
        <meta property="og:title" content="Infinite World">
        <meta property="og:description" content="Infinite procedurally generated world by Bruno Simon">
        <meta property="og:image" content="https://infinite-world.vercel.app/social/share-1200x630.png">
    </head>
    <body>
        <a href="/" class="exit-control" id="exit-btn" onclick="if(window.parent && window.parent !== window){window.parent.postMessage({type:'EXIT_EXPERIENCE'},'*');return false;}">← BHAVISHYA</a>
        <style>
            .exit-control {
                position: fixed;
                top: 20px;
                left: 24px;
                z-index: 10000;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #000;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid #000;
                padding: 8px 14px;
                text-decoration: none;
                border-radius: 2px;
                transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
                backdrop-filter: blur(8px);
                cursor: pointer;
            }
            .exit-control:hover {
                background: #00ff66;
                border-color: #00ff66;
                color: #000;
                box-shadow: 0 0 16px rgba(0, 255, 102, 0.5);
                transform: translateY(-1px);
            }
        </style>
        <div class="game">
            <div class="ui">
                <div class="mobile-warning">
                    This experience isn't suited for mobile devices
                </div>
                <div class="controls">
                    <div class="group">
                        <div class="element">
                            <div class="keys is-arrows">
                                <div class="key">A</div>
                                <div class="key">S</div>
                                <div class="key">D</div>
                                <div class="key">W</div>
                            </div>
                            move
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">F</div>
                            </div>
                            fullscreen
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">P</div>
                            </div>
                            pointer lock
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">V</div>
                            </div>
                            view mode
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">B</div>
                            </div>
                            debug
                        </div>
                    </div>
                    <div class="group">
                        Infinite procedurally generated world — <a href="https://github.com/brunosimon/infinite-world" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./sources/index.js"></script>
    </body>
</html>
