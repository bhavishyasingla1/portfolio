<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Infinite World</title>
        <link rel="stylesheet" href="./sources/style.css">

        <meta itemprop="name" content="Infinite World">
        <meta itemprop="description" content="Infinite procedurally generated world by Bruno Simon">
        <meta itemprop="image" content="https://infinite-world.vercel.app/social/share-1200x630.png">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Infinite World">
        <meta name="twitter:description" content="Infinite procedurally generated world by Bruno Simon">
        <meta name="twitter:image" content="https://infinite-world.vercel.app/social/share-1200x600.png">

        <meta property="og:site_name" content="Three.js Journey">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://infinite-world.vercel.app/">
        <meta property="og:title" content="Infinite World">
        <meta property="og:description" content="Infinite procedurally generated world by Bruno Simon">
        <meta property="og:image" content="https://infinite-world.vercel.app/social/share-1200x630.png">
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
        <link rel="shortcut icon" href="./favicon.ico" />
    </head>
    <body>
        <script>
            if (window.parent && window.parent !== window) {
                document.documentElement.classList.add('is-embedded');
            }
        </script>
        <a href="/" class="exit-control" id="exit-btn" onclick="if(window.parent && window.parent !== window){window.parent.postMessage({type:'EXIT_EXPERIENCE'},'*');return false;}">← HOME</a>
        <style>
            .is-embedded .exit-control {
                display: none !important;
            }
            .exit-control {
                position: fixed;
                top: 20px;
                left: 24px;
                z-index: 10000;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #000000;
                background-color: rgba(255, 255, 255, 0.95);
                border: 1.5px solid #000000;
                padding: 10px 18px;
                text-decoration: none;
                border-radius: 2px;
                transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
                backdrop-filter: blur(8px);
                cursor: pointer;
            }
            .exit-control:hover {
                background-color: #00ff66;
                border-color: #00ff66;
                color: #000000;
                box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
                transform: translateY(-1px);
            }
            .mobile-dpad {
                display: flex !important;
                position: fixed;
                bottom: max(28px, env(safe-area-inset-bottom, 28px));
                left: max(24px, env(safe-area-inset-left, 24px));
                z-index: 1000;
                pointer-events: auto;
                user-select: none;
                touch-action: none;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .mobile-dpad .dpad-middle-row {
                display: flex;
                gap: 8px;
            }
            .mobile-dpad .dpad-btn {
                width: 52px;
                height: 52px;
                background: rgba(12, 12, 16, 0.85);
                border: 1.5px solid rgba(255, 255, 255, 0.45);
                border-radius: 10px;
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                cursor: pointer;
                touch-action: none;
                user-select: none;
                outline: none;
                -webkit-tap-highlight-color: transparent;
                transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease, color 0.12s ease;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
            .mobile-dpad .dpad-btn svg {
                width: 24px;
                height: 24px;
                stroke: currentColor;
                stroke-width: 2.8;
                pointer-events: none;
            }
            .mobile-dpad .dpad-btn:hover {
                background: rgba(24, 24, 30, 0.95);
                border-color: rgba(255, 255, 255, 0.75);
                transform: translateY(-1px);
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            }
            .mobile-dpad .dpad-btn:active,
            .mobile-dpad .dpad-btn.is-active {
                background: rgba(0, 255, 102, 0.35);
                border-color: #00ff66;
                color: #00ff66;
                box-shadow: 0 0 24px rgba(0, 255, 102, 0.7);
                transform: scale(0.92);
            }
        </style>
        <div class="game">
            <div class="ui">
                <div class="mobile-warning">
                    This experience isn't suited for mobile devices
                </div>
                <div class="mobile-dpad" id="mobile-dpad" aria-label="Movement Controls">
                    <button class="dpad-btn dpad-up" data-direction="forward" aria-label="Move Forward">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="18 15 12 9 6 15"></polyline>
                        </svg>
                    </button>
                    <div class="dpad-middle-row">
                        <button class="dpad-btn dpad-left" data-direction="strafeLeft" aria-label="Move Left">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <button class="dpad-btn dpad-down" data-direction="backward" aria-label="Move Backward">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <button class="dpad-btn dpad-right" data-direction="strafeRight" aria-label="Move Right">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="controls">
                    <div class="group" style="margin-left: auto;">
                        Infinite procedurally generated world — <a href="https://github.com/brunosimon/infinite-world" target="_blank">GitHub</a>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./sources/index.js"></script>
    </body>
</html>
